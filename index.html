<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neuron AI Chatbot</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="app-body">
    <div class="app">
      <aside class="sidebar">
        <div>
          <div class="badge bg-light text-dark mb-3">Neuron AI</div>
          <button
            type="button"
            class="btn btn-outline-light btn-sm w-100 mb-4"
            id="newChatBtn"
          >
            New chat
          </button>
          <div class="api-box">
            <label for="apiKey" class="form-label text-white">API Key</label>
            <input
              type="password"
              class="form-control"
              id="apiKey"
              placeholder="Enter your API key"
            />
            <p class="small text-muted mt-2 mb-0">
              Keep your key private. It stays only in your browser.
            </p>
          </div>
        </div>
        <p class="small text-muted mb-0">
          Built with HTML, CSS, Bootstrap, JavaScript, and jQuery.
        </p>
      </aside>
      <main class="chat-panel">
        <header class="chat-header">
          <h2 class="h6 mb-0">ChatGPT-style Chatbot</h2>
        </header>
        <div
          id="chatWindow"
          class="chat-window"
          role="log"
          aria-live="polite"
          aria-relevant="additions"
        ></div>
        <form id="chatForm" class="chat-form">
          <div class="input-group">
            <input
              type="text"
              id="userInput"
              class="form-control"
              placeholder="Send a message..."
              autocomplete="off"
              required
            />
            <button class="btn btn-dark" type="submit" id="sendBtn">
              Send
            </button>
          </div>
          <p class="text-muted small mt-2 mb-0">
            Simple demo using OpenRouter-compatible API keys.
          </p>
        </form>
      </main>
    </div>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"
      crossorigin="anonymous"
    ></script>
    <script src="./app.js"></script>
  </body>
</html>
