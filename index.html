<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neuron AI Chatbot</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
              <h1 class="h5 mb-0">Simple Gemini Chatbot</h1>
            </div>
            <div class="card-body">
              <p class="text-muted small mb-3">
                Paste your Google AI Studio API key below. This key stays in your
                browser only.
              </p>
              <div class="mb-3">
                <label for="apiKey" class="form-label">API Key</label>
                <input
                  type="password"
                  class="form-control"
                  id="apiKey"
                  placeholder="AIzaSy..."
                />
              </div>
              <div id="chatWindow" class="chat-window mb-3"></div>
              <form id="chatForm" class="input-group">
                <input
                  type="text"
                  id="userInput"
                  class="form-control"
                  placeholder="Type your message..."
                  autocomplete="off"
                  required
                />
                <button class="btn btn-primary" type="submit" id="sendBtn">
                  Send
                </button>
              </form>
              <p class="text-muted small mt-3 mb-0">
                Tip: keep messages short for quick responses.
              </p>
            </div>
          </div>
          <p class="text-center text-muted small mt-3 mb-0">
            Built with HTML, CSS, Bootstrap, JavaScript, and jQuery.
          </p>
        </div>
      </div>
    </div>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"
      crossorigin="anonymous"
    ></script>
    <script src="./app.js"></script>
  </body>
</html>
